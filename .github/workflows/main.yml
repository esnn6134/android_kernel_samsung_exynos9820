name: Android 16 crDroid Kernel Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libssl-dev libcrypto++-dev lzop libncurses5-dev libncursesw5-dev libgmp-dev libmpfr-dev libmpc-dev libkmod-dev libelf-dev xz-utils crossbuild-essential-arm64
        
    - name: Fetch Official AOSP Clang Toolchain
      run: |
        mkdir clang
        cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xzf clang-r522817.tar.gz
        rm clang-r522817.tar.gz
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Setup Build Environment & Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "HEADER_ARCH=arm64" >> $GITHUB_ENV

    - name: Kernel Configuration
      run: |
        make O=out ARCH=arm64 exynos9820_defconfig

    - name: Compile Kernel with Clang
      run: |
        make -j$(nproc) O=out \
             ARCH=arm64 \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=aarch64-linux-gnu- \
             Image.gz dtbs

    - name: Verify and Pack Boot Image Component
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Derleme Başarılı! Dosya hazır."
        else
          echo "Hata: Image.gz oluşturulamadı!" && exit 1
        fi

    - name: Upload Modded Kernel (Image.gz)
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-16-Modded-Kernel
        path: out/arch/arm64/boot/Image.gz

    - name: Upload DTB Files (Donanım Ağacı)
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-16-DTBs
        path: out/arch/arm64/boot/dts/exy
        nos/*.dtb
